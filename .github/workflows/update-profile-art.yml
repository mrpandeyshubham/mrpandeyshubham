name: Update profile art

"on":
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours for near-real-time updates
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch real-time GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py
      - name: Fetch live stats (LeetCode, CodeChef, GitHub)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py
      - name: Render SVG assets
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
          python scripts/make_stats_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh live contributions & stats [skip ci]"
          file_pattern: "data/contributions.json data/stats.json contrib-heatmap.svg info-card.svg stats-card.svg"
