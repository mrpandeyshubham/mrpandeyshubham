    .tile-val { font: 700 21px 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
    .tile-sub { fill: #8b949e; font: 11px 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
